name: K2-OpenHost build

# Publishes a prebuilt mainsail.zip for every push to develop, so the
# k2-openhost-installer-helper installer and Moonraker's update manager
# ([update_manager mainsail] type: web, channel: beta) can install the fork
# without building it on the printer host.

on:
  push:
    branches: [develop]
    paths-ignore:
      - 'docs/**'
      - '**.md'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k2openhost-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'MzTechnology97/mainsail-k2openhost'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch repo
        uses: actions/checkout@v6

      - name: Install node
        uses: actions/setup-node@v6
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npx vite build

      - name: Package
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="v${version}-k2oh.${{ github.run_number }}"
          # Moonraker matches release_info.json against the configured repo.
          printf '{"project_name":"mainsail-k2openhost","project_owner":"MzTechnology97","version":"%s"}\n' "$tag" \
            > dist/release_info.json
          (cd dist && zip -qr ../mainsail.zip ./ -x '**.DS_Store')
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Publish pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ steps.package.outputs.tag }}" mainsail.zip \
            --target "$GITHUB_SHA" \
            --prerelease \
            --title "Mainsail K2-OpenHost ${{ steps.package.outputs.tag }}" \
            --notes "Automatic build of develop at ${GITHUB_SHA::8}. K2-OpenHost is experimental: features marked as pending hardware tests are not validated yet."
